spring.application.name=ServicioPrestamosRest
server.port=${PRESTAMOS_PUERTO:8082}

# Base de datos propia del microservicio (independiente de la de Libro y Ejemplar).
libreria.mongo.uri=${PRESTAMOS_MONGO_URI:mongodb://localhost:27017}
libreria.mongo.base=${PRESTAMOS_MONGO_BASE:libreria_prestamos}

# Credencial con la que el microservicio de Libro y Ejemplar invoca este servicio.
spring.security.user.name=${PRESTAMOS_USUARIO:servicio-libreria}
spring.security.user.password=${PRESTAMOS_CLAVE:prestamos-local}
